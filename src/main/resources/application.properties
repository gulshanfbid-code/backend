spring.application.name=backend

# Server
server.port=${PORT:8888}

# yt-dlp / FFmpeg
# Local Windows defaults are retained for local development.
yt-dlp.path=${YT_DLP_PATH:D:/instagram-downloader/tools/yt-dlp.exe}
yt-dlp.download-dir=${YT_DLP_DOWNLOAD_DIR:downloads}
yt-dlp.ffmpeg-path=${YT_DLP_FFMPEG_PATH:D:/instagram-downloader/tools/ffmpeg.exe}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
